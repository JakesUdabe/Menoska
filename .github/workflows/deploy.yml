name: Despliegue Automático a Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Compilar y Desplegar
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: 🚚 Obtener código fuente
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint

      - name: 🔍 Typecheck
        run: npm run typecheck

      - name: 🏗️ Compilar proyecto (Build)
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for key in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta el secret $key para el build de producción."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Añade los secrets en GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          npm run build
          test -f out/index.html

      - name: 🚀 Subir archivos compilados a Hostinger vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./out/
          server-dir: /domains/menoska-consulting.com/public_html/
          dangerous-clean-slate: true
          log-level: verbose
          timeout: 300000