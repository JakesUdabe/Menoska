name: Despliegue Automático a Hostinger

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Compilar y desplegar
    runs-on: ubuntu-24.04

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Compilar proyecto (Build)
        env:
          # Next incrusta NEXT_PUBLIC_* en el cliente durante el build.
          # El resto (Stripe, OpenAI, EPO, Resend, service role) se lee del .env del servidor.
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          missing=0
          for key in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!key}" ]; then
              echo "::error::Falta el secret $key para el build de producción."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Añade los secrets en GitHub → Settings → Secrets and variables → Actions."
            echo "Valores locales de referencia: .env.example"
            exit 1
          fi
          url="$(printf '%s' "$NEXT_PUBLIC_SUPABASE_URL" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")"
          case "$url" in
            http://*|https://*) ;;
            *.supabase.co|*.supabase.co/) url="https://${url%/}" ;;
            *)
              echo "::warning::NEXT_PUBLIC_SUPABASE_URL no empieza por https://. El build publica la web con el contenido de reserva. El valor tiene que ser https://nheyqairforzviwheyrq.supabase.co"
              url=""
              ;;
          esac
          if [ -n "$url" ]; then
            export NEXT_PUBLIC_SUPABASE_URL="$url"
          else
            unset NEXT_PUBLIC_SUPABASE_URL
          fi
          npm run build

      - name: Preparar carpeta de despliegue
        run: |
          mkdir -p release
          cp package.json package-lock.json next.config.ts release/
          cp -r public release/public
          cp -r .next release/.next
          rm -rf release/.next/cache

      # Hostinger resetea el socket de datos (ECONNRESET). lftp reanuda por IPv4/PASV.
      - name: Subir archivos compilados a Hostinger vía FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          python3 << 'PY'
          import os
          from pathlib import Path

          def lftp_quote(value: str) -> str:
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          server = os.environ["FTP_SERVER"].strip().rstrip("/")
          lower = server.lower()
          for prefix in ("ftp://", "ftps://"):
              if lower.startswith(prefix):
                  server = server[len(prefix):]
                  break

          username = os.environ["FTP_USERNAME"]
          password = os.environ["FTP_PASSWORD"]
          remote = "/domains/menoska-consulting.com/public_html"
          lines = [
              "set cmd:fail-exit yes",
              "set net:timeout 30",
              "set net:max-retries 10",
              "set net:reconnect-interval-base 5",
              "set net:reconnect-interval-multiplier 1",
              'set dns:order "inet"',
              "set ftp:passive-mode true",
              "set ftp:prefer-epsv false",
              "set ftp:ssl-allow true",
              "set ssl:verify-certificate no",
              "set xfer:clobber on",
              f"open ftp://{server}",
              f"user {lftp_quote(username)} {lftp_quote(password)}",
              (
                  "mirror --reverse --continue --verbose --parallel=2 "
                  "--exclude-glob .env --exclude-glob .env.* "
                  "--exclude-glob node_modules/** --exclude-glob .htaccess "
                  f"./release {remote}"
              ),
              "bye",
          ]
          path = Path("lftp-deploy.script")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)
          PY
          lftp -f lftp-deploy.script
          rm -f lftp-deploy.script
